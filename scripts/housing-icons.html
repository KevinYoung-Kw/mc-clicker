<!doctype html><meta charset="utf-8"><title>Housing model icons</title><script type="module">
import * as T from 'three';import {HOMES,homeModel} from '../src/housing-models.js';
const renderer=new T.WebGLRenderer({alpha:true,antialias:true,preserveDrawingBuffer:true});renderer.setSize(192,192);renderer.setPixelRatio(1);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;document.body.append(renderer.domElement);
window.homeIcons=HOMES.map(h=>h.id);window.renderHomeIcon=id=>{const root=homeModel(HOMES.find(h=>h.id===id)),scene=new T.Scene();scene.add(root);scene.add(new T.HemisphereLight('#fff6df','#78846a',2.1));const sun=new T.DirectionalLight('#fff0d2',3.2);sun.position.set(-4,8,5);scene.add(sun);const bounds=new T.Box3().setFromObject(root),size=bounds.getSize(new T.Vector3()),center=bounds.getCenter(new T.Vector3());const span=Math.max(size.x,size.y,size.z)*1.4+.18,camera=new T.OrthographicCamera(-span/2,span/2,span/2,-span/2,.05,60);camera.position.copy(center).add(new T.Vector3(6,5.3,8));camera.lookAt(center);camera.updateProjectionMatrix();renderer.render(scene,camera);return renderer.domElement.toDataURL('image/png');};
</script>
